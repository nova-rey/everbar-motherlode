[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everbar-motherlode"
version = "0.1.0"
description = "Reproducible, provenance-rich symbolic music corpus construction for Dreamstream Everbar"
requires-python = ">=3.12"
dependencies = ["mido==1.3.3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
everbar-motherlode = "everbar_motherlode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
